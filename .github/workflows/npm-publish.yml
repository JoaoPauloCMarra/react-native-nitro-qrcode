name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14

    steps:
      - name: Checkout release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fail fast on duplicate npm version
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/react-native-nitro-qrcode/package.json').version")"
          if bun pm view "react-native-nitro-qrcode@${PACKAGE_VERSION}" version 2>/dev/null | grep -q "${PACKAGE_VERSION}"; then
            echo "react-native-nitro-qrcode@${PACKAGE_VERSION} already exists on npm."
            exit 1
          fi
          echo "react-native-nitro-qrcode@${PACKAGE_VERSION} is not published yet."

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/react-native-nitro-qrcode/package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]; then
            echo "Release ref ${GITHUB_REF} does not match release tag ${RELEASE_TAG}."
            exit 1
          fi

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ${RELEASE_TAG} does not match expected tag ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Verify release preflight
        run: bun run release:preflight

      - name: Publish package
        working-directory: packages/react-native-nitro-qrcode
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          DIST_TAG="latest"
          case "${PACKAGE_VERSION}" in
            *-*) DIST_TAG="next" ;;
          esac
          echo "Publishing ${PACKAGE_VERSION} with dist-tag ${DIST_TAG}."
          npm publish --access public --tag "${DIST_TAG}"
