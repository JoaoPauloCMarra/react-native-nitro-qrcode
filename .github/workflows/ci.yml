name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  TZ: UTC

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify core versions
        run: bun run verify:core-versions

      - name: Verify RN 0.87 strict TypeScript compatibility
        run: bun run typecheck:rn087

      - name: Verify generated Nitro bindings
        run: bun run codegen:check

      - name: Check example app
        run: bun run example:check

      - name: Lint
        run: bun run lint:check

      - name: Typecheck package
        run: bun run typecheck

      - name: Test public types
        run: bun run test:types

      - name: JavaScript coverage
        run: bun run test:coverage -- --runInBand --watchman=false

      - name: C++ tests
        run: bun run test:cpp

      - name: C++ sanitizers
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          bun run test:cpp:sanitize

      - name: C++ benchmark smoke
        run: bun run benchmark:cpp:smoke

      - name: Test lifecycle and release contracts
        run: bun run test:lifecycle

      - name: Build package artifacts
        run: bun run build

      - name: Audit package contents
        run: bun run audit:package

      - name: Validate auth-free publication
        run: bun run publish-package:dry-run

  example-android:
    name: Example app (Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Free disk space and select JDK 17
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          df -h /
      - run: bun install --frozen-lockfile
      - name: Generate the Android project
        run: CI=1 bun run --cwd apps/example prebuild -- --platform android
      - name: Build the Android example (debug, arm64-v8a)
        run: bun run example:android:assemble

  example-ios:
    name: Example app (iOS build)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate the iOS project
        run: CI=1 bun run --cwd apps/example prebuild -- --platform ios
      - name: Build the iOS example (Debug, simulator)
        run: bun run example:ios:build
