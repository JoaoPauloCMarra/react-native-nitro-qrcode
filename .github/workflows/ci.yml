name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  TZ: UTC

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify core versions
        run: bun run verify:core-versions

      - name: Verify RN 0.87 strict TypeScript compatibility
        run: bun run typecheck:rn087

      - name: Verify generated Nitro bindings
        run: bun run codegen:check

      - name: Verify smoke reporting
        run: bun run example:smoke:ci

      - name: Check example app
        run: bun run example:check

      - name: Lint
        run: bun run lint:check

      - name: Typecheck package
        run: bun run typecheck

      - name: Test public types
        run: bun run test:types

      - name: JavaScript coverage
        run: bun run test:coverage -- --runInBand --watchman=false

      - name: C++ tests
        run: bun run test:cpp

      - name: C++ sanitizers
        run: bun run test:cpp:sanitize

      - name: C++ benchmark smoke
        run: bun run benchmark:cpp:smoke

  android-example:
    name: Android example
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Prebuild Android example
        run: CI=1 bun run --cwd apps/example prebuild -- --platform android

      - name: Assemble Android example
        run: bun run example:android:assemble

  ios-example:
    name: iOS example
    runs-on: macos-26

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Prebuild iOS example
        run: CI=1 bun run --cwd apps/example prebuild -- --platform ios

      - name: Build iOS example
        run: bun run example:ios:build
